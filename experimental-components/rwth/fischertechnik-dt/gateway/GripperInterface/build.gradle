plugins {
  id 'java'
  id("cd2pojo") version "7.7.0-SNAPSHOT"
  id("montiarc-jsim") version "7.7.0-SNAPSHOT"

}

group = 'de.se-rwth.fischertechnik'
version = '7.8.0-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(11)
  }
}

repositories {
    maven {
        url = uri("https://nexus.se.rwth-aachen.de/content/groups/public/")
    }
    mavenCentral()
    maven { // Eclipse Paho
        url = "https://repo.eclipse.org/content/repositories/paho-releases/"
    }
}

dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    implementation("montiarc.libraries:simulator-rte:7.7.0-SNAPSHOT")

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "montiarc.libraries:simulator-test-rte:7.7.0-SNAPSHOT"
    testImplementation "org.assertj:assertj-core:3.24.2"
}

tasks.compileMontiarc {
  useClass2Mc.set(true)
}


test {
    useJUnitPlatform()
}