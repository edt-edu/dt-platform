<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
    <g [attr.transform]= "'translate(100, 100) rotate(' + rotationDeg + '  0 0)'">
        <circle r="10" fill="#AAAAAA" />
        <line x1="0"  y1="0" x2="100" y2="0" stroke="green"/>
        <line [attr.x1]="horizontalPercentage"  y1="-10" [attr.x2]="horizontalPercentage" y2="10" stroke="red"/>
    </g>
    <g transform="translate(200, 0)">
        <g transform = "translate(100, 150) rotate(-90 0 0)">
            <rect x="-10" y="-10" width="10" height="20" fill="#AAAAAA"/>
            <line x1="0"  y1="0" x2="100" y2="0" stroke="black"/>
            <line [attr.x1]="verticalPercentage"  y1="-10" [attr.x2]="verticalPercentage" y2="100" stroke="green" />
            <line [attr.x1]="verticalPercentage - 10"  [attr.y1]="horizontalPercentage" [attr.x2]="verticalPercentage + 10" [attr.y2]="horizontalPercentage" stroke="red" />
        </g>
    </g>
</svg>
