version: '3.9'

services:
  # Frontend
  front-end:
    container_name: front-end
    hostname: localhost
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        ENV: dev
    image: front-end:latest
    ports:
      - 4200:80
    command: [nginx, '-g', 'daemon off;']
    restart: unless-stopped
    network_mode: host
      
